<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>S.A Education — Login</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="login-page">
  <section class="login-wrap">
    <div class="brand-side">
      <div class="brand-logo">S.A<small>education</small></div>
      <div class="wave">🎓</div>
      <p>Aprender juntos,<br>transformar o futuro.</p>
    </div>
    <div class="auth">
      <h1>Bem-vindo de volta!</h1>
      <p>Faça login para continuar.</p>
      <form action="index.php" method="get">
        <div class="form-group"><label>E-mail ou nome de usuário</label><input class="form-control" name="login" placeholder="E-mail ou nome de usuário"></div>
        <div class="form-group"><label>Senha</label><input class="form-control" type="password" name="senha" placeholder="Senha"></div>
        <p style="text-align:right"><a href="#" style="color:var(--purple)">Esqueceu a senha?</a></p>
        <button class="btn full" type="submit">Entrar</button>
      </form>
      <div class="auth-divider">ou continuar com</div>
      <div class="grid grid-2">
        <button class="btn outline">🌈 Google</button>
        <button class="btn outline">▦ Microsoft</button>
      </div>
      <p style="text-align:center;margin-top:28px">Não tem uma conta? <a href="cadastro.html" style="color:var(--purple);font-weight:700">Cadastre-se</a></p>
    </div>
  </section>
</main>
</body>
</html>
